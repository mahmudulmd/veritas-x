<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veritas Instant Screen Recorder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0e14;
      color: #f7f9f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 24px;
      color: #1d9bf0;
      margin-bottom: 8px;
    }
    p {
      color: #8b98a5;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn {
      background: #1d9bf0;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 8px;
    }
    .btn:hover { background: #1a8cd8; transform: translateY(-2px); }
    .btn-stop {
      background: #f4212e;
      display: none;
    }
    .btn-stop:hover { background: #dc1e29; }
    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #00ba7c;
      font-weight: 600;
    }
    .timer {
      font-size: 32px;
      font-weight: 700;
      color: #f4212e;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="font-size: 40px; margin-bottom: 10px;">🎥</div>
    <h1>Veritas Screen Recorder</h1>
    <p>Founder: Md. Mahmudul Hoque<br>Click below to record your 30s X demo video cleanly.</p>

    <button id="start-btn" class="btn">🔴 Start Recording</button>
    <button id="stop-btn" class="btn btn-stop">⏹️ Stop & Save Video</button>

    <div id="timer" class="timer">00:00</div>
    <div id="status" class="status"></div>
  </div>

  <script>
    let mediaRecorder;
    let recordedChunks = [];
    let timerInterval;
    let seconds = 0;

    const startBtn = document.getElementById("start-btn");
    const stopBtn = document.getElementById("stop-btn");
    const timerEl = document.getElementById("timer");
    const statusEl = document.getElementById("status");

    startBtn.addEventListener("click", async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 60 },
          audio: false
        });

        recordedChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm; codecs=vp9" });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          clearInterval(timerInterval);
          const blob = new Blob(recordedChunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "Veritas_ElonMusk_Demo.webm";
          a.click();
          statusEl.innerText = "✅ Video downloaded successfully into your Downloads folder!";
          startBtn.style.display = "inline-flex";
          stopBtn.style.display = "none";
          timerEl.style.display = "none";
        };

        mediaRecorder.start();

        startBtn.style.display = "none";
        stopBtn.style.display = "inline-flex";
        timerEl.style.display = "block";
        statusEl.innerText = "⏺️ Recording in progress... Go to your X tab and test!";

        seconds = 0;
        timerInterval = setInterval(() => {
          seconds++;
          const mins = String(Math.floor(seconds / 60)).padStart(2, "0");
          const secs = String(seconds % 60).padStart(2, "0");
          timerEl.innerText = `${mins}:${secs}`;
        }, 1000);

        // When user stops sharing via browser bar
        stream.getVideoTracks()[0].onended = () => {
          if (mediaRecorder.state !== "inactive") mediaRecorder.stop();
        };

      } catch (err) {
        statusEl.innerText = "Error: " + err.message;
      }
    });

    stopBtn.addEventListener("click", () => {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
