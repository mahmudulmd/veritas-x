<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veritas Video Trimmer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0e14;
      color: #f7f9f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 24px;
      max-width: 720px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    h1 { font-size: 20px; color: #1d9bf0; margin-bottom: 6px; }
    p { color: #8b98a5; font-size: 13px; margin-bottom: 16px; }
    video {
      width: 100%;
      max-height: 380px;
      border-radius: 12px;
      background: #000;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      text-align: left;
      background: rgba(255,255,255,0.03);
      padding: 14px;
      border-radius: 10px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: #1d9bf0;
      cursor: pointer;
    }
    .btn {
      background: #1d9bf0;
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: #1a8cd8; transform: translateY(-1px); }
    .status { margin-top: 14px; font-size: 13px; color: #00ba7c; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>✂️ Veritas Video Trimmer</h1>
    <p>Founder: Md. Mahmudul Hoque — Auto-trimming start & end</p>

    <video id="vid" controls src="raw_demo.webm"></video>

    <div class="slider-group">
      <div class="slider-row">
        <span><b>Start Time (শুরু):</b> <span id="start-val">3.0s</span></span>
        <input type="range" id="start-range" min="0" max="18" step="0.1" value="3.0">
      </div>
      <div class="slider-row">
        <span><b>End Time (শেষ):</b> <span id="end-val">13.5s</span></span>
        <input type="range" id="end-range" min="0" max="18" step="0.1" value="13.5">
      </div>
    </div>

    <button id="trim-btn" class="btn">⚡ Trim & Download Video</button>
    <div id="status" class="status"></div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const vid = document.getElementById("vid");
    const startRange = document.getElementById("start-range");
    const endRange = document.getElementById("end-range");
    const startVal = document.getElementById("start-val");
    const endVal = document.getElementById("end-val");
    const trimBtn = document.getElementById("trim-btn");
    const statusEl = document.getElementById("status");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    vid.addEventListener("loadedmetadata", () => {
      startRange.max = vid.duration;
      endRange.max = vid.duration;
      endRange.value = Math.max(0, vid.duration - 3.5);
      endVal.innerText = Number(endRange.value).toFixed(1) + "s";
    });

    startRange.addEventListener("input", () => {
      startVal.innerText = Number(startRange.value).toFixed(1) + "s";
      vid.currentTime = Number(startRange.value);
    });

    endRange.addEventListener("input", () => {
      endVal.innerText = Number(endRange.value).toFixed(1) + "s";
      vid.currentTime = Number(endRange.value);
    });

    trimBtn.addEventListener("click", async () => {
      const startTime = Number(startRange.value);
      const endTime = Number(endRange.value);

      if (endTime <= startTime) {
        alert("End time must be greater than start time!");
        return;
      }

      trimBtn.disabled = true;
      trimBtn.innerText = "⏳ Processing Video...";
      statusEl.innerText = "Trimming frames...";

      canvas.width = vid.videoWidth || 1920;
      canvas.height = vid.videoHeight || 1080;

      const stream = canvas.captureStream(60);
      const recorder = new MediaRecorder(stream, { mimeType: "video/webm; codecs=vp9" });
      const chunks = [];

      recorder.ondataavailable = (e) => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: "video/webm" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Veritas_Final_Demo_Trimmed.webm";
        a.click();

        statusEl.innerText = "✅ Trimmed video downloaded! (Veritas_Final_Demo_Trimmed.webm)";
        trimBtn.disabled = false;
        trimBtn.innerText = "⚡ Trim & Download Video";
      };

      vid.currentTime = startTime;
      await new Promise(r => vid.onseeked = r);

      recorder.start();

      let animationId;
      function drawFrame() {
        if (vid.currentTime >= endTime || vid.ended) {
          cancelAnimationFrame(animationId);
          vid.pause();
          recorder.stop();
          return;
        }
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);
        animationId = requestAnimationFrame(drawFrame);
      }

      vid.play();
      drawFrame();
    });
  </script>
</body>
</html>
